<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Echo</title><link rel="stylesheet" href="../style.css">
<style>#pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(86vw,360px)}
.pad{aspect-ratio:1;border-radius:24px;opacity:.45;cursor:pointer;transition:opacity .1s,transform .1s}
.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 30px currentColor}</style></head>
<body>
<a class="back" href="../index.html">← All games</a>
<h1>🌈 Color Echo</h1>
<div class="bar"><span class="stat">Round: <b id="round">0</b></span><span class="stat">Best: <b id="best">0</b></span><button id="go">Start</button></div>
<div id="pads"></div><p class="msg" id="msg">Watch the colors light up, then repeat the pattern.</p>
<script>
const $=id=>document.getElementById(id),COL=['#ff5470','#5ce1e6','#ffd23f','#7cf08a'],TONE=[262,330,392,523];
let seq=[],pos=0,listening=false,ac,best=+(localStorage.getItem('echoBest')||0);$('best').textContent=best;
COL.forEach((c,i)=>{const d=document.createElement('div');d.className='pad';d.style.background=c;d.style.color=c;d.onclick=()=>press(i);$('pads').appendChild(d)});
function beep(i,ms){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=TONE[i];o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+ms/1000);o.start();o.stop(ac.currentTime+ms/1000)}catch(e){}}
function flash(i,ms=400){const p=$('pads').children[i];p.classList.add('lit');beep(i,ms);setTimeout(()=>p.classList.remove('lit'),ms)}
function playSeq(){listening=false;$('msg').textContent='Watch...';const gap=Math.max(250,600-seq.length*20);
seq.forEach((v,k)=>setTimeout(()=>flash(v,gap*.7),600+k*gap));setTimeout(()=>{listening=true;pos=0;$('msg').textContent='Your turn!'},600+seq.length*gap)}
function addRound(){seq.push(Math.floor(Math.random()*4));$('round').textContent=seq.length;playSeq()}
function press(i){if(!listening)return;flash(i,250);if(i!==seq[pos]){listening=false;const s=seq.length-1;
$('msg').textContent=`Oops! You made it through ${s} round${s===1?'':'s'}.`;if(s>best){best=s;localStorage.setItem('echoBest',best);$('best').textContent=best}return}
pos++;if(pos===seq.length){listening=false;$('msg').textContent='Nice!';setTimeout(addRound,700)}}
$('go').onclick=()=>{seq=[];addRound()};
</script></body></html>
