<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse Runner</title><link rel="stylesheet" href="../style.css"></head>
<body>
<a class="back" href="../index.html">← All games</a>
<h1>🟦 Pulse Runner</h1>
<div class="bar"><select id="lvl"></select><span class="stat">Attempt: <b id="att">1</b></span><span class="stat">Best: <b id="best">0</b>%</span></div>
<canvas id="c" width="800" height="400"></canvas>
<p class="msg" id="msg">Space, ↑, or click to jump. Hold to keep jumping. Yellow pads launch you high!</p>
<script>
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),W=800,H=400;
const T=40,ROWS=5,GROUND=340,P=34,SPEED=6.5,G=0.95,JUMP=-13.5,PAD=-19;
// A segment is a list of rows (bottom row last); shorter rows are padded on the right
function S(...rows){const w=Math.max(...rows.map(r=>r.length));return[...Array(ROWS-rows.length).fill(''),...rows].map(r=>r.padEnd(w,'.'))}
const e=n=>S('.'.repeat(n));
function join(segs){const rows=Array(ROWS).fill('');segs.forEach(s=>s.forEach((r,i)=>rows[i]+=r));return rows}
const POOL=[S('^'),S('^^'),S('^^^'),S('#'),S('##'),S('#','#'),S('.#','##'),S('#..#..#'),S('*..^^^^'),S('.###','^^^^'),S('##^^##'),S('^...^'),S('..#','.##','###')];
function randomLevel(){const segs=[e(16)];for(let i=0;i<40;i++){segs.push(POOL[Math.floor(Math.random()*POOL.length)]);segs.push(e(7+Math.floor(Math.random()*4)))}return join(segs)}
const LEVELS=[
{name:'1 · Sunny Steps',color:'#5ce1e6',map:join([e(16),S('^'),e(8),S('^'),e(8),S('^^'),e(8),S('#'),e(8),S('##'),e(8),S('^^'),e(8),S('.#','##'),e(8),S('*..^^^^'),e(8),S('^'),e(7),S('^'),e(8),S('###'),e(8),S('^^^'),e(8),S('#..#..#'),e(14)])},
{name:'2 · Neon Night',color:'#ff6fb5',map:join([e(16),S('^^'),e(7),S('#','#'),e(7),S('^^^'),e(7),S('.###','^^^^'),e(7),S('..#','.##','###'),e(7),S('*..^^^^'),e(6),S('##^^##'),e(7),S('^...^'),e(7),S('#','#'),e(5),S('^^'),e(7),S('.###','^^^^'),e(7),S('^^^'),e(14)])},
{name:'3 · Spike Storm',color:'#ffd23f',map:join([e(16),S('^^^'),e(6),S('^^^'),e(6),S('#','#'),e(4),S('^^'),e(6),S('.###','^^^^'),e(5),S('^^^'),e(6),S('..#','.##','###'),e(5),S('*..^^^^'),e(5),S('##^^##'),e(5),S('^...^'),e(5),S('#..#..#'),e(5),S('.###','^^^^'),e(5),S('#','#'),e(5),S('^^^'),e(14)])},
{name:'🎲 Random level',color:'#7cf08a',random:true}];
// One physics step. Returns 'dead' or null. Shared with the test solver.
function physics(p,jump,map){
p.x+=SPEED;if(p.ground&&jump){p.vy=JUMP;p.ground=false}
p.vy=Math.min(p.vy+G,20);const prevB=p.y+P;p.y+=p.vy;p.ground=false;
if(p.y+P>=GROUND){p.y=GROUND-P;p.vy=0;p.ground=true}
const c0=Math.floor(p.x/T),c1=Math.floor((p.x+P)/T);
for(let col=c0;col<=c1;col++)for(let r=0;r<ROWS;r++){const t=map[r][col];if(!t||t==='.')continue;
const tx=col*T,ty=GROUND-(ROWS-r)*T,hit=(ax,ay,aw,ah)=>p.x<ax+aw&&p.x+P>ax&&p.y<ay+ah&&p.y+P>ay;
if(t==='#'&&hit(tx,ty,T,T)){if(prevB<=ty&&p.vy>=0){p.y=ty-P;p.vy=0;p.ground=true}else return'dead'}
if(t==='^'&&hit(tx+13,ty+14,14,26))return'dead';
if(t==='*'&&hit(tx,ty+28,T,12)){p.vy=PAD;p.ground=false}}
return null}
window.RUNNER={LEVELS,physics,P,GROUND,T};
let L,map,p,att=1,dead=0,won=false,held=false,parts=[],spin=0;
LEVELS.forEach((l,i)=>$('lvl').add(new Option(l.name,i)));
function bestKey(){return'runnerBest'+L}
function pick(){L=+$('lvl').value;if(LEVELS[L].random)LEVELS[L].map=randomLevel();map=LEVELS[L].map;att=1;$('best').textContent=localStorage.getItem(bestKey())||0;$('lvl').blur();reset()}
function reset(){p={x:0,y:GROUND-P,vy:0,ground:true};dead=0;won=false;parts=[];spin=0;$('att').textContent=att}
const len=()=>map[0].length*T;
function step(){if(dead){if(--dead===0){att++;reset()}parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.3});return}
if(won)return;
if(physics(p,held,map)==='dead'){dead=45;for(let i=0;i<24;i++)parts.push({x:p.x+P/2,y:p.y+P/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.8)*10});saveBest();return}
spin=p.ground?Math.round(spin/(Math.PI/2))*(Math.PI/2):spin+.12;
if(p.x>=len()-10*T){won=true;saveBest(100);$('msg').textContent=`🎉 Level complete in ${att} attempt${att>1?'s':''}! Press Space for another go.`}}
function pct(){return Math.min(100,Math.floor(p.x/(len()-10*T)*100))}
function saveBest(v=pct()){const b=+(localStorage.getItem(bestKey())||0);if(v>b){localStorage.setItem(bestKey(),v);$('best').textContent=v}}
function draw(){const col=LEVELS[L].color,cam=p.x-200;
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f0b2b');g.addColorStop(1,'#2a2360');x.fillStyle=g;x.fillRect(0,0,W,H);
x.strokeStyle='rgba(255,255,255,.05)';for(let i=-(cam*.3%80);i<W;i+=80){x.strokeRect(i,40,80,80);x.strokeRect(i+40,160,80,80)}
x.fillStyle=col;x.fillRect(0,GROUND,W,2);x.fillStyle='#16123a';x.fillRect(0,GROUND+2,W,H);
const c0=Math.max(0,Math.floor(cam/T)),c1=Math.floor((cam+W)/T)+1;
for(let cc=c0;cc<=c1;cc++)for(let r=0;r<ROWS;r++){const t=map[r][cc];if(!t||t==='.')continue;const tx=cc*T-cam,ty=GROUND-(ROWS-r)*T;
if(t==='#'){x.fillStyle='#1b1640';x.fillRect(tx,ty,T,T);x.strokeStyle=col;x.lineWidth=2;x.strokeRect(tx+1,ty+1,T-2,T-2)}
if(t==='^'){x.fillStyle='#fff';x.beginPath();x.moveTo(tx+4,ty+T);x.lineTo(tx+T/2,ty+6);x.lineTo(tx+T-4,ty+T);x.fill()}
if(t==='*'){x.fillStyle='#ffd23f';x.beginPath();x.roundRect(tx+4,ty+30,T-8,10,5);x.fill()}}
const fx=len()-10*T-cam;if(fx<W){x.fillStyle=col;for(let y=0;y<GROUND;y+=20)x.fillRect(fx+((y/20)%2)*10,y,10,10)}
if(dead){x.fillStyle=col;parts.forEach(q=>x.fillRect(q.x-cam,q.y,6,6))}
else{x.save();x.translate(p.x-cam+P/2,p.y+P/2);x.rotate(spin);x.fillStyle=col;x.fillRect(-P/2,-P/2,P,P);x.fillStyle='#0f0b2b';x.fillRect(-P/2+7,-P/2+7,P-14,P-14);x.fillStyle=col;x.fillRect(-5,-5,10,10);x.restore()}
x.fillStyle='rgba(255,255,255,.15)';x.fillRect(200,14,400,8);x.fillStyle=col;x.fillRect(200,14,4*pct(),8);
x.fillStyle='#fff';x.font='bold 14px sans-serif';x.textAlign='left';x.fillText(pct()+'%',610,22)}
let last=performance.now(),acc=0;
function frame(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(frame)}
function press(){held=true;if(won){att=1;reset();$('msg').textContent=''}}
addEventListener('keydown',e=>{if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();press()}});
addEventListener('keyup',e=>{if([' ','ArrowUp','w','W'].includes(e.key))held=false});
c.addEventListener('mousedown',press);c.addEventListener('touchstart',e=>{e.preventDefault();press()},{passive:false});
addEventListener('mouseup',()=>held=false);addEventListener('touchend',()=>held=false);
$('lvl').onchange=pick;pick();requestAnimationFrame(frame);
</script></body></html>
