<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Hopper</title><link rel="stylesheet" href="../style.css"></head>
<body>
<a class="back" href="../index.html">← All games</a>
<h1>🚀 Star Hopper</h1>
<div class="bar"><span class="stat">Height: <b id="score">0</b></span><span class="stat">Best: <b id="best">0</b></span></div>
<canvas id="c" width="360" height="560"></canvas>
<p class="msg" id="msg">← → or A/D to move (or tap the sides). Press Space or click to start.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);
let best=+(localStorage.getItem('skyBest')||0);$('best').textContent=best;
let p,clouds,stars,height,running=false,left=false,right=false;
function reset(){p={x:W/2,y:H-80,vx:0,vy:-11};height=0;clouds=[];stars=[];
for(let y=H-20;y>-40;y-=70)addCloud(y);Object.assign(clouds[0],{x:W/2-35,fragile:false,vx:0});
for(let i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3})}
function addCloud(y){const lvl=height/1000,moving=Math.random()<Math.min(.4,lvl*.1),fragile=Math.random()<Math.min(.3,lvl*.08);
clouds.push({x:Math.random()*(W-70),y,w:70,vx:moving?(Math.random()<.5?-1:1)*(1+lvl*.3):0,fragile,gone:false,spring:!fragile&&Math.random()<.07})}
function start(){reset();running=true;$('msg').textContent=''}
function loop(){if(running){
p.vx=(right?5:0)-(left?5:0);p.x+=p.vx;if(p.x<-15)p.x=W+15;if(p.x>W+15)p.x=-15;
p.vy+=.4;p.y+=p.vy;
if(p.vy>0)for(const cl of clouds){if(cl.gone)continue;if(p.x>cl.x-8&&p.x<cl.x+cl.w+8&&p.y+14>cl.y&&p.y+14<cl.y+16){
if(cl.fragile){cl.gone=true;continue}p.vy=cl.spring?-18:-11}}
for(const cl of clouds){cl.x+=cl.vx;if(cl.x<0||cl.x>W-cl.w)cl.vx*=-1}
if(p.y<H/2.5){const d=H/2.5-p.y;p.y+=d;height+=d;clouds.forEach(cl=>cl.y+=d);stars.forEach(s=>{s.y+=d*.3;if(s.y>H){s.y-=H;s.x=Math.random()*W}})}
clouds=clouds.filter(cl=>cl.y<H+20);let top=Math.min(...clouds.map(cl=>cl.y));while(top>-40){top-=60+Math.min(40,height/400);addCloud(top)}
$('score').textContent=Math.floor(height/10);
if(p.y>H+30){running=false;const s=Math.floor(height/10);$('msg').textContent=`You fell! Height ${s}. Press Space or click to try again.`;
if(s>best){best=s;localStorage.setItem('skyBest',best);$('best').textContent=best}}}
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f0b2b');g.addColorStop(1,'#3a2a7a');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#fff';stars.forEach(s=>{x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
for(const cl of clouds){if(cl.gone)continue;x.fillStyle=cl.fragile?'#c9a7ff':'#fff';x.globalAlpha=cl.fragile?.7:1;x.beginPath();x.roundRect(cl.x,cl.y,cl.w,12,6);x.fill();
if(cl.spring){x.fillStyle='#ffd23f';x.fillRect(cl.x+cl.w/2-6,cl.y-6,12,6)}}x.globalAlpha=1;
if(p){x.font='30px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🐰',p.x,p.y)}
requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')left=true;if(k==='arrowright'||k==='d')right=true;if(k===' '){e.preventDefault();if(!running)start()}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')left=false;if(k==='arrowright'||k==='d')right=false});
function touch(e){e.preventDefault();if(!running){start();return}const r=c.getBoundingClientRect(),tx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;left=tx<r.width/2;right=!left}
c.addEventListener('mousedown',touch);c.addEventListener('touchstart',touch,{passive:false});
['mouseup','mouseleave','touchend'].forEach(ev=>c.addEventListener(ev,()=>{left=right=false}));
reset();loop();
</script></body></html>
