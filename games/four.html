<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four in a Row</title><link rel="stylesheet" href="../style.css">
<style>#b{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#3b5bdb;padding:10px;border-radius:16px;width:min(94vw,520px)}
.h{aspect-ratio:1;border-radius:50%;background:var(--bg);cursor:pointer}.h.r{background:#ff5470}.h.y{background:#ffd23f}.h.win{box-shadow:0 0 0 4px #fff inset}</style></head>
<body>
<a class="back" href="../index.html">← All games</a>
<h1>🔴 Four in a Row 🟡</h1>
<div class="bar"><select id="mode"><option value="2">2 players</option><option value="cpu">vs Computer</option></select><button id="new">New game</button></div>
<div id="b"></div><p class="msg" id="msg"></p>
<script>
const R=6,C=7,$=id=>document.getElementById(id);let g,turn,done;
const NAME={r:'Red',y:'Yellow'};
function lines(b,r,c){const out=[];for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[[r,c]];
for(const s of[1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<R&&cc>=0&&cc<C&&b[rr][cc]===b[r][c]){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}}
if(cells.length>=4)out.push(cells)}return out}
function drop(b,c){for(let r=R-1;r>=0;r--)if(!b[r][c])return r;return -1}
function render(){const el=$('b');el.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='h '+g[r][c];d.onclick=()=>move(c,true);el.appendChild(d)}}
function move(c,human){if(done||(human&&$('mode').value==='cpu'&&turn==='y'))return;const r=drop(g,c);if(r<0)return;g[r][c]=turn;render();
const w=lines(g,r,c);if(w.length){done=true;w.flat().forEach(([a,b])=>$('b').children[a*C+b].classList.add('win'));$('msg').textContent=NAME[turn]+' wins! 🎉';return}
if(g[0].every(Boolean)){done=true;$('msg').textContent="It's a tie!";return}
turn=turn==='r'?'y':'r';$('msg').textContent=NAME[turn]+"'s turn";if($('mode').value==='cpu'&&turn==='y')setTimeout(cpu,450)}
function score(b,p){// simple heuristic: count open windows
let s=0;const o=p==='y'?'r':'y';for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){
let mine=0,theirs=0,ok=true;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C){ok=false;break}if(b[rr][cc]===p)mine++;else if(b[rr][cc]===o)theirs++}
if(!ok)continue;if(!theirs)s+=[0,1,5,50,10000][mine];if(!mine)s-=[0,1,6,60,10000][theirs]}
for(let r=0;r<R;r++)if(b[r][3]===p)s+=3;return s}
function search(b,depth,p,a,be){const valid=[3,2,4,1,5,0,6].filter(c=>drop(b,c)>=0);
if(!depth||!valid.length)return{s:score(b,'y')};let best={s:p==='y'?-1e9:1e9,c:valid[0]};
for(const c of valid){const r=drop(b,c);b[r][c]=p;let res;if(lines(b,r,c).length)res={s:(p==='y'?1:-1)*(1e6+depth)};else res=search(b,depth-1,p==='y'?'r':'y',a,be);b[r][c]='';
if(p==='y'?res.s>best.s:res.s<best.s)best={s:res.s,c};if(p==='y')a=Math.max(a,res.s);else be=Math.min(be,res.s);if(a>=be)break}return best}
function cpu(){move(search(g.map(r=>[...r]),5,'y',-1e9,1e9).c,false)}
function newGame(){g=Array.from({length:R},()=>Array(C).fill(''));turn='r';done=false;render();$('msg').textContent="Red's turn"}
$('new').onclick=newGame;$('mode').onchange=newGame;newGame();
</script></body></html>
