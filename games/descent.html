<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Descent</title><link rel="stylesheet" href="../style.css">
<style>#wrap{position:relative;width:min(96vw,960px);aspect-ratio:16/10}
#c{width:100%;height:100%;display:block;border-radius:14px;background:#0a0618;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,4,20,.6);border-radius:14px;pointer-events:none}
.ov.hide{display:none}.ov h2{font-size:3rem;margin:0;color:#fff;text-shadow:0 0 18px #ff3fd8,0 0 4px #fff}.ov p{color:#e6dcff;font-size:1.15rem;margin:6px}</style></head>
<body>
<a class="back" href="../index.html">← All games</a>
<h1>🔮 Neon Descent</h1>
<div class="bar"><span class="stat">Score: <b id="score">0</b></span><span class="stat">Best: <b id="best">0</b></span><span class="stat">Speed: <b id="spd">0</b></span></div>
<div id="wrap"><canvas id="c" width="960" height="600"></canvas>
<div class="ov" id="ov"><h2 id="ovt">Neon Descent</h2><p id="ovs">Roll down the endless neon track. Don't fall off and don't hit the glowing blocks!</p><p><b>← →</b> or <b>A D</b> to steer &nbsp;·&nbsp; tap left/right on touchscreens</p><p><b>Press Space or click to start</b></p></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d'),W=cv.width,H=cv.height;
// ---- world constants (units are "track tiles") ----
const L=2,R=.32,T=.7,G=26,S=.28,VIEW=120,F=H*.95,PITCH=Math.atan(S)+.2,CP=Math.cos(PITCH),SP=Math.sin(PITCH);
let segs,gen,ball,cam,state='title',score=0,best=+(localStorage.getItem('descentBest')||0),trail,parts,tilt=0,t=0,shake=0;
$('best').textContent=best;
// ---- track generation ----
// each segment i covers z in [i*L,(i+1)*L) and holds strips {x,w,h0,h1}; obstacles {x,z,s,amp,ph}; gems {x,z,h}
const DUP=7.5;let glitch=false,spaceHits=0;
function dupSeg(sg){if(sg.dup)return;sg.dup=true;sg.strips.push(...sg.strips.map(st=>({...st,x:st.x+DUP})));
 sg.obs.push(...sg.obs.map(o=>({...o,x:o.x+DUP})));sg.gems.push(...sg.gems.map(g=>({...g,x:g.x+DUP})))}
function addSeg(strips,obs=[],gems=[]){const sg={strips,obs,gems};segs.push(sg);if(glitch)dupSeg(sg)}
function strip(x,w,h0,h1=h0,flags={}){return{x,w,h0,h1,...flags}}
function difficulty(){return Math.min(1,segs.length/900)}
function chunk(){const d=difficulty(),r=Math.random(),z=()=>segs.length*L+L/2;
const pick=[['curve',3],['gap',1.4+d],['narrow',1+d],['split',1+d],['ramp',.8+d],['steps',1],['blocks',.6+d*1.4],['zigzag',.6+d],['movers',.4+d*1.4],['pad',1.2],['padwall',.5+d],['tunnel',1.4]];
if(segs.length<30){return curve(30,0)}
let tot=pick.reduce((a,p)=>a+p[1],0),q=Math.random()*tot,kind='curve';for(const p of pick){if((q-=p[1])<0){kind=p[0];break}}
const n0=segs.length;({curve:()=>curve(10+Math.floor(Math.random()*10),.12+d*.2),gap,narrow,split,ramp,steps,blocks,zigzag,movers,pad,padwall,tunnel})[kind]();for(let i=n0;i<segs.length;i++)segs[i].kind=kind;
curve(3+Math.floor((1-d)*4),0)}// a short calm stretch between features
function curve(n,obsChance){for(let i=0;i<n;i++){gen.ph+=gen.turn;gen.x+=Math.sin(gen.ph)*.22;const w=3.2,obs=[],gm=[];
 if(Math.random()<obsChance&&i%2===0&&i>1)obs.push({x:gen.x+(Math.random()-.5)*(w-1),z:segs.length*L+L/2,s:.36});
 if(Math.random()<.06)gm.push({x:gen.x+(Math.random()-.5)*(w-.8),z:segs.length*L+L/2});
 addSeg([strip(gen.x,w,gen.h)],obs,gm)}gen.turn=(Math.random()-.5)*.25}
function gap(){const n=Math.random()<difficulty()?2:1;for(let i=0;i<n;i++)addSeg([]);gen.h-=1+n*.6;
 addSeg([strip(gen.x,3.2,gen.h)],[],[{x:gen.x,z:segs.length*L+L/2,h:gen.h+1.4}])}
function narrow(){const n=8+Math.floor(Math.random()*6),w=1.15+(1-difficulty())*.5;for(let i=0;i<n;i++){gen.ph+=.35;gen.x+=Math.sin(gen.ph)*.18;addSeg([strip(gen.x,w,gen.h)])}}
function split(){const n=10,side=Math.random()<.5?-1:1;addSeg([strip(gen.x,4.6,gen.h)]);
 for(let i=0;i<n;i++){const obs=(i===4||i===8)?[{x:gen.x+side*1.65,z:segs.length*L+L/2,s:.4}]:[];addSeg([strip(gen.x-1.65,1.3,gen.h),strip(gen.x+1.65,1.3,gen.h)],obs,i===6?[{x:gen.x-side*1.65,z:segs.length*L+L/2}]:[])}
 addSeg([strip(gen.x,4.6,gen.h)])}
function ramp(){const up=1.1;addSeg([strip(gen.x,2.6,gen.h,gen.h+up*.5)]);addSeg([strip(gen.x,2.6,gen.h+up*.5,gen.h+up)]);
 const n=2+(Math.random()<difficulty()?1:0);for(let i=0;i<n;i++)addSeg([],[],i===0?[{x:gen.x,z:segs.length*L+L/2,h:gen.h+up+1}]:[]);gen.h-=1.2;addSeg([strip(gen.x,3.6,gen.h)]);addSeg([strip(gen.x,3.6,gen.h)])}
function steps(){for(let i=0;i<6;i++){gen.h-=.55;addSeg([strip(gen.x,3,gen.h)])}}
function blocks(){const w=4.2,lanes=[-1.4,0,1.4];let open=1;for(let i=0;i<14;i++){const obs=[];if(i%4===2){// rows with one open lane that only moves one lane at a time
 open=Math.max(0,Math.min(2,open+(Math.random()<.5?-1:1)));lanes.forEach((l,k)=>{if(k!==open)obs.push({x:gen.x+l,z:segs.length*L+L/2,s:.4})})}
 addSeg([strip(gen.x,w,gen.h)],obs)}}
function zigzag(){for(let i=0;i<4;i++){gen.x+=(i%2?-1:1)*.9;for(let k=0;k<3;k++)addSeg([strip(gen.x,1.9,gen.h)]);gen.h-=.3}}
// jump pad: launches the ball over a long gap onto a lower landing
function padSeg(w){addSeg([strip(gen.x,w,gen.h,gen.h,{pad:true})])}
function pad(){addSeg([strip(gen.x,3.2,gen.h)]);padSeg(3.2);const n=3+(Math.random()<difficulty()?1:0);
 for(let i=0;i<n;i++)addSeg([],[],i===1?[{x:gen.x,z:segs.length*L+L/2,h:gen.h+2.2}]:[]);gen.h-=1.5;for(let i=0;i<12;i++)addSeg([strip(gen.x,3.4,gen.h)])}
// jump pad in front of a wall of blocks you can't steer around
function padwall(){addSeg([strip(gen.x,3.4,gen.h)]);padSeg(3.4);addSeg([strip(gen.x,3.4,gen.h)]);
 addSeg([strip(gen.x,3.4,gen.h)],[-1.2,-.4,.4,1.2].map(o=>({x:gen.x+o,z:segs.length*L+L/2,s:.4})));for(let i=0;i<8;i++)addSeg([strip(gen.x,3.4,gen.h)])}
// tunnel: solid tube you roll through. A one-tile kicker ramp in front can launch you onto the roof.
function tunnel(){const n=16+Math.floor(Math.random()*8),w=2.8,lane=(Math.random()<.5?-1:1)*.85;
 addSeg([strip(gen.x,w,gen.h)]);addSeg([strip(gen.x,w,gen.h),strip(gen.x+lane,1,gen.h,gen.h+1,{kick:true,tz:(segs.length+4)*L})]);
 for(let i=0;i<3;i++)addSeg([strip(gen.x,w,gen.h)]);
 for(let i=0;i<n;i++){if(i>2){gen.ph+=.18;gen.x+=Math.sin(gen.ph)*.16}
  const obs=(i>3&&i<n-2&&i%4===0)?[{x:gen.x+(Math.random()<.5?-.7:.7),z:segs.length*L+L/2,s:.38}]:[];
  const gm=i%4===2?[{x:gen.x,z:segs.length*L+L/2}]:i%5===3?[{x:gen.x,z:segs.length*L+L/2,h:gen.h+TH+.6}]:[];// some crystals on the roof too
  addSeg([strip(gen.x,w,gen.h,gen.h,{tunnel:true})],obs,gm)}}
function movers(){for(let i=0;i<12;i++){const obs=i%3===1?[{x:gen.x,z:segs.length*L+L/2,s:.4,amp:1.05,ph:Math.random()*6}]:[];addSeg([strip(gen.x,3.4,gen.h)],obs)}}
function ensure(z){while(segs.length*L<z+VIEW+20)chunk()}
// ---- physics ----
function obsX(o){return o.amp?o.x+Math.sin(t*2.2+o.ph)*o.amp:o.x}
const TH=2.7,ROOF=.35;// tunnel inner height and roof thickness
function surfaces(px,pz){const s=segs[Math.floor(pz/L)];if(!s)return[];const f=pz/L-Math.floor(pz/L),out=[];
 for(const st of s.strips){if(Math.abs(px-st.x)>st.w/2)continue;const h=st.h0+(st.h1-st.h0)*f,dh=(st.h1-st.h0)/L;
  out.push({h,dh,st,f,roof:false});if(st.tunnel)out.push({h:h+TH+ROOF,dh,st,f,roof:true})}
 return out.sort((a,b)=>a.h-b.h)}
// without a height: the lowest floor (for blocks and crystals). With one: the highest surface the ball can be standing on
function groundAt(px,pz,py){const ss=surfaces(px,pz);if(!ss.length)return null;if(py===undefined)return ss[0];let b=null;for(const q of ss)if(q.h<=py+.35)b=q;return b}
function reset(){segs=[];gen={x:0,h:0,ph:0,turn:.1};ensure(0);ball={x:0,y:0,z:4,vx:0,vy:0,vz:11,lastG:0,roll:0,inT:false};glitch=false;spaceHits=0;cam={x:0,y:0};trail=[];parts=[];score=0;t=0}
function crash(why){if(state!=='play')return;state='over';shake=12;for(let i=0;i<40;i++)parts.push({x:ball.x,y:ball.y+R,z:ball.z,vx:(Math.random()-.5)*6,vy:Math.random()*6,vz:(Math.random()-.3)*6,life:60});
 const s=Math.floor(score);if(s>best){best=s;localStorage.setItem('descentBest',best);$('best').textContent=best}
 $('ovt').textContent=why;$('ovs').textContent=`Score ${s}${s>=best?' · New best! 🎉':''}`;setTimeout(()=>{if(state==='over')$('ov').classList.remove('hide')},500)}
const keys=new Set();let touchDir=0;
function step(dt){t+=dt;if(state!=='play'){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=G*dt*.5;p.life--});return}
const dir=((keys.has('ArrowRight')||keys.has('KeyD'))?1:0)-((keys.has('ArrowLeft')||keys.has('KeyA'))?1:0)||touchDir;
ball.vz=Math.min(30,ball.vz+dt*.16);const steer=6+ball.vz*.12;ball.vx+=(dir*steer-ball.vx)*Math.min(1,dt*9);tilt+=(dir-tilt)*dt*6;
const px=ball.x;ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.vy-=G*dt;ball.y+=ball.vy*dt;ball.roll+=ball.vz*dt/R;
const cs=segs[Math.floor(ball.z/L)];let inT=false;
// inside a tunnel: bounce off the walls, bump the ceiling, or smash into the tunnel's front if you come in too high
if(cs)for(const st of cs.strips){if(!st.tunnel||Math.abs(px-st.x)>st.w/2+R)continue;const h=st.h0,top=h+TH;
 if(ball.y>h-.3&&ball.y<top){inT=true;const lo=st.x-st.w/2+R,hi=st.x+st.w/2-R;
  if(ball.x<lo||ball.x>hi){ball.x=Math.max(lo,Math.min(hi,ball.x));ball.vx*=-.35;
   for(let i=0;i<6;i++)parts.push({x:ball.x,y:ball.y+R,z:ball.z,vx:(Math.random()-.5)*3,vy:Math.random()*3,vz:ball.vz*.8,life:18,col:'#ffe36e'})}
  if(ball.y+2*R>top){if(!ball.inT)return crash('You hit the tunnel!');ball.y=top-2*R;ball.vy=Math.min(ball.vy,0)}}}
ball.inT=inT;
const g=groundAt(ball.x,ball.z,ball.y);
if(g&&ball.y<=g.h){ball.y=g.h;ball.vy=g.dh*ball.vz;ball.lastG=g.h;
 if(g.st.pad&&!g.roof&&g.f>.15){ball.vy=11.5;ball.y+=.02;shake=4;
  for(let i=0;i<18;i++)parts.push({x:ball.x,y:ball.y,z:ball.z,vx:(Math.random()-.5)*4,vy:Math.random()*6,vz:ball.vz*.5,life:25,col:'#b6ff5c'})}
 if(g.st.kick&&(g.f>.85||g.f+ball.vz*dt*1.2/L>=1)){const tt=Math.max(.1,(g.st.tz-ball.z)/ball.vz);ball.vy=(g.st.h0+TH+ROOF+.6-ball.y+G/2*tt*tt)/tt;// just clears the roof edgeball.y+=.02;
  for(let i=0;i<12;i++)parts.push({x:ball.x,y:ball.y,z:ball.z,vx:(Math.random()-.5)*3,vy:Math.random()*5,vz:ball.vz*.5,life:22,col:'#ffe36e'})}}
// a floor slab just above the ball: rolled into its front (crash) or slid against its side (keep falling)
for(const q of surfaces(ball.x,ball.z))if(!q.roof&&ball.y<q.h-.35&&ball.y>q.h-T-R*2){
 if(Math.abs(px-q.st.x)<=q.st.w/2)return crash('You hit a wall!');ball.x=px;ball.vx=0}
for(const k of[-1,0,1]){const s=segs[Math.floor(ball.z/L)+k];if(!s)continue;
 for(const o of s.obs){const ox=obsX(o),top=(groundAt(ox,o.z)||{h:ball.lastG}).h;if(Math.abs(ball.x-ox)<o.s+R*.8&&Math.abs(ball.z-o.z)<o.s+R*.8&&ball.y<top+o.s*2)return crash('Crashed into a block!')}
 for(const gm of s.gems)if(!gm.got){const gy=gm.h!==undefined?gm.h:(groundAt(gm.x,gm.z)||{h:0}).h+.6;if(Math.abs(ball.x-gm.x)<.6&&Math.abs(ball.z-gm.z)<.7&&Math.abs(ball.y+R-gy)<1){gm.got=true;score+=50;
  for(let i=0;i<14;i++)parts.push({x:gm.x,y:gy,z:gm.z,vx:(Math.random()-.5)*4,vy:Math.random()*4,vz:ball.vz*.6+(Math.random()-.5)*3,life:30,col:'#ff7ae6'})}}}
if(ball.y<ball.lastG-9)return crash('You fell off!');
score+=ball.vz*dt*.5;ensure(ball.z);
trail.push({x:ball.x,y:ball.y,z:ball.z});if(trail.length>14)trail.shift();
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=G*dt*.5;p.life--});parts=parts.filter(p=>p.life>0)}
// ---- 3D drawing ----
let camWX,camWY,camZ;
function proj(px,py,pz){const dx=px-camWX,dy=(py-pz*S)-camWY,dz=pz-camZ,y2=dy*CP+dz*SP,z2=dz*CP-dy*SP;if(z2<.2)return null;return[W/2+dx*F/z2,H*.42-y2*F/z2,z2]}
function poly(pts,fill,stroke,a){const P=pts.map(p=>proj(...p));if(P.some(p=>!p))return;x.beginPath();x.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)x.lineTo(P[i][0],P[i][1]);x.closePath();
 x.globalAlpha=a;x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=1.6;x.stroke()}x.globalAlpha=1}
function fog(z){return Math.max(0,Math.min(1,1-Math.pow((z-camZ)/VIEW,1.6)))}
function drawPad(pd,st,z0){const a=fog(z0),l=pd.x-pd.w/2,r=pd.x+pd.w/2,n=z0+.25,f=z0+L-.25,h=st.h0+.01,pulse=.6+.4*Math.sin(t*10);
 poly([[l,h,n],[r,h,n],[r,h,f],[l,h,f]],`rgba(120,255,80,${.25+.25*pulse})`,'#b6ff5c',a);
 for(let k=0;k<3;k++){const zz=n+.3+k*.45,P=[proj(pd.x-.5,h,zz),proj(pd.x,h,zz+.35),proj(pd.x+.5,h,zz)];if(P.some(q=>!q))continue;// chevrons pointing forward
  x.globalAlpha=a;x.strokeStyle='#eaffb0';x.lineWidth=3;x.beginPath();x.moveTo(P[0][0],P[0][1]);x.lineTo(P[1][0],P[1][1]);x.lineTo(P[2][0],P[2][1]);x.stroke();x.globalAlpha=1}}
function tunnelShape(st,h,z){const l=st.x-st.w/2,r=st.x+st.w/2,tp=h+TH+ROOF;return[[l,h,z],[l,tp-.3,z],[l+.3,tp,z],[r-.3,tp,z],[r,tp-.3,z],[r,h,z]]}
function drawTunnel(st,z0,first){const z1=z0+L,a=fog(z0),A=tunnelShape(st,st.h0,z0),B=tunnelShape(st,st.h1,z1),hue=(z0*.6+280)%360,edge=`hsl(${hue},100%,68%)`;
 // solid panels: walls, bevels and roof, farthest from the camera first
 const cy=camWY+z0*S,pan=[[0,1],[1,2],[2,3],[3,4],[4,5]].map(([i,j])=>({i,j,d:Math.hypot((A[i][0]+A[j][0])/2-camWX,(A[i][1]+A[j][1])/2-cy)})).sort((p,q)=>q.d-p.d);
 for(const{i,j}of pan)poly([A[i],A[j],B[j],B[i]],i===2?'#26124f':'#1a0c3a',null,a);
 // neon rings and lengthwise edges
 const P=A.map(q=>proj(...q)),Q=B.map(q=>proj(...q));if(P.some(q=>!q)||Q.some(q=>!q))return;x.globalAlpha=a;x.strokeStyle=edge;x.lineWidth=first?4:2;x.shadowColor=edge;x.shadowBlur=first?14:6;
 x.beginPath();x.moveTo(P[0][0],P[0][1]);for(const q of P.slice(1))x.lineTo(q[0],q[1]);for(const k of[1,2,3,4]){x.moveTo(P[k][0],P[k][1]);x.lineTo(Q[k][0],Q[k][1])}x.stroke();x.shadowBlur=0;x.globalAlpha=1}
function drawKick(st,z0){const a=fog(z0),l=st.x-st.w/2,r=st.x+st.w/2,z1=z0+L;
 poly([[l,st.h0,z0],[l,st.h1,z1],[l,st.h0,z1]],'#3a2a08','#ffe36e',a);poly([[r,st.h0,z0],[r,st.h1,z1],[r,st.h0,z1]],'#3a2a08','#ffe36e',a);
 poly([[l,st.h0,z0],[r,st.h0,z0],[r,st.h1,z1],[l,st.h1,z1]],'#6b4e0c','#ffe36e',a);poly([[l,st.h0,z1],[r,st.h0,z1],[r,st.h1,z1],[l,st.h1,z1]],'#2a1d05','#ffe36e',a)}
function drawStrip(st,z0){const z1=z0+L,l=st.x-st.w/2,r=st.x+st.w/2,a=fog(z0),hue=(z0*.6+200)%360;
 const edge=`hsl(${hue},100%,65%)`;
 if(camWX<l)poly([[l,st.h0,z0],[l,st.h1,z1],[l,st.h1-T,z1],[l,st.h0-T,z0]],'#140a2e',edge,a);
 if(camWX>r)poly([[r,st.h0,z0],[r,st.h1,z1],[r,st.h1-T,z1],[r,st.h0-T,z0]],'#140a2e',edge,a);
 poly([[l,st.h0,z0],[r,st.h0,z0],[r,st.h0-T,z0],[l,st.h0-T,z0]],'#1d0f3f',edge,a);
 poly([[l,st.h0,z0],[r,st.h0,z0],[r,st.h1,z1],[l,st.h1,z1]],'#241452',edge,a);
 // faint lane lines on top
 const A=proj(st.x,st.h0,z0),B=proj(st.x,st.h1,z1);if(A&&B){x.globalAlpha=a*.25;x.strokeStyle=edge;x.lineWidth=1;x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.stroke();x.globalAlpha=1}}
function drawCube(cx,base,cz,s){const a=fog(cz),c='#ff4b6e',l=cx-s,r=cx+s,n=cz-s,f=cz+s,top=base+s*2,pulse=.5+.5*Math.sin(t*6);
 if(camWX<l)poly([[l,base,n],[l,base,f],[l,top,f],[l,top,n]],'#4a0f22',c,a);if(camWX>r)poly([[r,base,n],[r,base,f],[r,top,f],[r,top,n]],'#4a0f22',c,a);
 poly([[l,top,n],[r,top,n],[r,top,f],[l,top,f]],'#7a1a3a',c,a);poly([[l,base,n],[r,base,n],[r,top,n],[l,top,n]],`rgba(${140+pulse*60},30,70,1)`,'#ffd0dc',a)}
function drawGem(gm){if(gm.got)return;const gy=(gm.h!==undefined?gm.h:(groundAt(gm.x,gm.z)||{h:0}).h+.6)+Math.sin(t*4+gm.z)*.12,P=proj(gm.x,gy,gm.z);if(!P)return;
 const s=.28*F/P[2];x.save();x.translate(P[0],P[1]);x.rotate(t*2);x.globalAlpha=fog(gm.z);x.shadowColor='#ff7ae6';x.shadowBlur=14;x.fillStyle='#ff9aed';
 x.beginPath();x.moveTo(0,-s);x.lineTo(s*.7,0);x.lineTo(0,s);x.lineTo(-s*.7,0);x.closePath();x.fill();x.restore();x.globalAlpha=1}
function drawBall(){const P=proj(ball.x,ball.y+R,ball.z);if(!P)return;const r=R*F/P[2];
 trail.forEach((p,i)=>{const Q=proj(p.x,p.y+R,p.z);if(!Q)return;x.globalAlpha=i/trail.length*.18;x.fillStyle='#5ff3ff';x.beginPath();x.arc(Q[0],Q[1],R*F/Q[2]*(i/trail.length)*.6,0,7);x.fill()});x.globalAlpha=1;
 x.save();x.shadowColor='#5ff3ff';x.shadowBlur=26;const g=x.createRadialGradient(P[0]-r*.35,P[1]-r*.4,r*.1,P[0],P[1],r);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#8ff8ff');g.addColorStop(1,'#1b8fd6');

 // rolling bands so you can see it spin
 x.save();x.beginPath();x.arc(P[0],P[1],r,0,7);x.clip();x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=Math.max(1,r*.12);
 for(let k=0;k<2;k++){const yy=P[1]+Math.sin(ball.roll+k*Math.PI)*r*.8;if(Math.cos(ball.roll+k*Math.PI)>0){x.beginPath();x.ellipse(P[0],yy,r*.95,r*.25,0,0,7);x.stroke()}}x.restore()}
const CITY=[[],[]];{let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
 for(const[li,n,minH,maxH,minW,maxW]of[[0,46,30,95,22,46],[1,30,45,150,30,64]]){let bx=0;for(let i=0;i<n;i++){const w=minW+rnd()*(maxW-minW),h=minH+rnd()*(maxH-minH);
  const win=[];for(let wy=8;wy<h-6;wy+=9)for(let wx=5;wx<w-5;wx+=8)if(rnd()<.32)win.push([wx,wy,rnd()]);

 CITY.forEach((layer,li)=>{const off=((cam.x*(li?9:4))%layer.span+layer.span)%layer.span;
  for(let rep=-1;rep<=Math.ceil(W/layer.span);rep++)for(const b of layer){const bx=b.x-off+rep*layer.span;if(bx>W||bx+b.w<0)continue;const top=base-b.h;
   x.fillStyle=li?'#12052a':'#250a45';x.fillRect(bx,top,b.w,b.h);
   if(b.spire){x.fillRect(bx+b.w/2-1,top-18,2,18);x.fillStyle=Math.sin(t*3+b.x)>0?'#ff4b6e':'#5a1830';x.fillRect(bx+b.w/2-2,top-20,4,3)}
   for(const[wx,wy,r]of b.win){x.fillStyle=r>.6?'rgba(255,214,120,.75)':r>.3?'rgba(120,240,255,.6)':'rgba(255,90,210,.55)';x.fillRect(bx+wx,top+wy,3,4)}
   if(b.neon&&li){x.strokeStyle=b.neon;x.shadowColor=b.neon;x.shadowBlur=8;x.lineWidth=1.5;x.beginPath();x.moveTo(bx,top);x.lineTo(bx+b.w,top);x.stroke();x.shadowBlur=0}}})
 const hz=x.createLinearGradient(0,base-30,0,base);hz.addColorStop(0,'rgba(122,31,110,0)');hz.addColorStop(1,'rgba(255,63,164,.35)');x.fillStyle=hz;x.fillRect(0,base-30,W,30)}
function drawSky(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07021a');g.addColorStop(.45,'#2a0b4a');g.addColorStop(.62,'#7a1f6e');g.addColorStop(1,'#07021a');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<70;i++){const sx=(i*137.5)%W,sy=(i*71.3)%(H*.45);x.fillStyle=`rgba(255,255,255,${.3+.3*Math.sin(t*2+i)})`;x.fillRect(sx,sy,1.5,1.5)}
 const sx=W/2-tilt*30,sy=H*.36;const sg=x.createLinearGradient(0,sy-120,0,sy+60);sg.addColorStop(0,'#ffe36e');sg.addColorStop(1,'#ff3fa4');x.fillStyle=sg;

 x.fillStyle='#2a0b4a';for(let k=0;k<7;k++){const yy=sy-30+k*12+(t*20%12);x.fillRect(sx-120,yy,240,2+k*.8)}x.restore();drawCity();
 x.strokeStyle='rgba(255,80,200,.35)';x.lineWidth=1;for(let k=0;k<14;k++){const yy=H*.44+Math.pow(k/14,2)*H*.6;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}}
function draw(){camWX=cam.x;camZ=ball.z-4.6;camWY=cam.y-camZ*S+2.1;
 x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}
 drawSky();x.save();x.translate(W/2,H/2);x.rotate(-tilt*.04);x.translate(-W/2,-H/2);
 const i0=Math.max(0,Math.floor((ball.z-6)/L)),i1=Math.min(segs.length-1,Math.floor((ball.z+VIEW)/L)),items=[];
 for(let i=i0;i<=i1;i++){const s=segs[i],z0=i*L;let above=false;// camera above a tunnel roof here: hide what's inside it
  for(const st of s.strips){if(st.kick){items.push({k:z0+L-.001,d:Math.abs(st.x-camWX),f:()=>drawKick(st,z0)});continue}
   if(st.tunnel){const up=camWY>st.h0-z0*S+TH+ROOF;above=above||up;const first=!(segs[i-1]||{strips:[]}).strips.some(q=>q.tunnel&&Math.abs(q.x-st.x)<1);
    items.push({k:up?z0+L-.002:z0+L+.002,d:Math.abs(st.x-camWX),f:()=>drawTunnel(st,z0,first)});if(up)continue}
   items.push({k:z0+L,d:Math.abs(st.x-camWX),f:()=>{drawStrip(st,z0);if(st.pad)drawPad({x:st.x,w:st.w},st,z0)}})}
  for(const o of s.obs){if(above&&s.strips.some(q=>q.tunnel&&Math.abs(o.x-q.x)<q.w/2))continue;const ox=obsX(o);items.push({k:o.z+o.s,d:Math.abs(ox-camWX),f:()=>drawCube(ox,(groundAt(ox,o.z)||{h:0}).h,o.z,o.s)})}
  for(const gm of s.gems){if(above&&gm.h===undefined&&s.strips.some(q=>q.tunnel))continue;items.push({k:gm.z,d:0,f:()=>drawGem(gm)})}}
 if(state!=='over')items.push({k:ball.z+.01,d:-1,f:drawBall});
 items.sort((a,b)=>b.k-a.k||b.d-a.d);items.forEach(it=>it.f());
 for(const p of parts){const P=proj(p.x,p.y,p.z);if(!P)continue;x.globalAlpha=Math.min(1,p.life/30);x.fillStyle=p.col||'#5ff3ff';const s=Math.max(1.5,.12*F/P[2]);x.fillRect(P[0]-s/2,P[1]-s/2,s,s)}x.globalAlpha=1;
 x.restore();x.restore();if(glitch)tear();

function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step(1/60);cam.x+=(ball.x-cam.x)*.12;cam.y+=(Math.max(ball.y,ball.lastG-2.5)-cam.y)*.1;acc-=1000/60}draw();requestAnimationFrame(frame)}
