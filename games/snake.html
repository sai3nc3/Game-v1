<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title><link rel="stylesheet" href="../style.css"></head>
<body>
<a class="back" href="../index.html">← All games</a>
<h1>🐍 Snake</h1>
<div class="bar"><span class="stat">Score: <b id="score">0</b></span><span class="stat">Best: <b id="best">0</b></span>
<select id="speed"><option value="140">Slow</option><option value="100" selected>Normal</option><option value="65">Fast</option></select>
<button id="start">Start</button></div>
<canvas id="c" width="480" height="480"></canvas>
<p class="msg" id="msg">Arrow keys or WASD to move. Space to pause.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=24,S=c.width/N;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');
let best=+(localStorage.getItem('snakeBest')||0);bestEl.textContent=best;
let snake,dir,next,food,score,timer,paused,alive=false;
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function start(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};next=dir;score=0;scoreEl.textContent=0;paused=false;alive=true;place();
clearInterval(timer);timer=setInterval(step,+document.getElementById('speed').value);msg.textContent='Go!';draw()}
function step(){if(paused)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;clearInterval(timer);msg.textContent='Game over! Score '+score+'. Press Start to play again.';
if(score>best){best=score;localStorage.setItem('snakeBest',best);bestEl.textContent=best;msg.textContent+=' New best!'}draw();return}
snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;place()}else snake.pop();draw()}
function draw(){x.fillStyle='#0f0b2b';x.fillRect(0,0,c.width,c.height);
x.font=S+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🍎',food.x*S+S/2,food.y*S+S/2+2);
snake.forEach((s,i)=>{x.fillStyle=i?'#5ce1e6':'#ff6fb5';x.beginPath();x.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,6);x.fill()})}
const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=keys[e.key.length===1?e.key.toLowerCase():e.key];
if(k){e.preventDefault();if(!alive)return;if(k[0]!==-dir.x||k[1]!==-dir.y)next={x:k[0],y:k[1]}}
if(e.key===' '){e.preventDefault();if(alive){paused=!paused;msg.textContent=paused?'Paused':'Go!'}else start()}});
let tx,ty;c.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});
c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(!alive)return;
const k=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];if(k[0]!==-dir.x||k[1]!==-dir.y)next={x:k[0],y:k[1]}});
document.getElementById('start').onclick=e=>{e.target.blur();start()};
snake=[{x:12,y:12}];food={x:16,y:12};draw();
</script></body></html>
